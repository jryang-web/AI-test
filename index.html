<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176447">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script defer src="./pwa.js"></script>
<title>報修登記系統</title><link rel="stylesheet" href="./style.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="./config.js"></script><script defer src="./app.js"></script>
</head>
<body><main>
<header><p class="eyebrow">一起維護更好的工作環境</p><h1>報修登記</h1><p>記下問題，讓每一件報修都有紀錄。</p><button id="install-app" type="button" hidden>安裝報修登記</button><p class="hint">可從瀏覽器選單安裝；iPhone 請用 Safari「分享 → 加入主畫面」。</p><p id="connection-message" role="status" aria-live="polite"></p><p id="pwa-message" role="status" aria-live="polite"></p></header>
<section aria-labelledby="form-title"><h2 id="form-title">新增報修</h2><p class="hint">所有欄位皆必填。此為公開示範，請使用虛構姓名與地點，勿填敏感資訊。</p>
<form id="repair-form">
<div class="grid"><label>報修人<input name="reporter_name" required maxlength="100" autocomplete="off" placeholder="例如：示範同事甲"></label>
<label>地點或部門<input name="location" required maxlength="200" placeholder="例如：示範辦公室"></label>
<label>類別<select name="category" required><option value="">請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
<label>緊急程度<select name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label></div>
<label>問題說明<textarea name="description" required maxlength="2000" rows="5" placeholder="請描述問題與發生情況（最多 2000 字）"></textarea></label>
<button id="submit" type="submit" disabled>送出報修</button><p id="form-message" role="status" aria-live="polite"></p>
</form></section>
<section aria-labelledby="list-title"><div class="section-head"><h2 id="list-title">最近報修</h2><button id="refresh" type="button">重新整理</button></div><p class="hint">最近 20 筆，依登記時間由新到舊排列。</p><div class="urgency-filters" role="group" aria-label="依緊急程度篩選"><button type="button" data-urgency="全部" aria-pressed="true" aria-controls="requests">全部</button><button type="button" data-urgency="高" aria-pressed="false" aria-controls="requests">高</button><button type="button" data-urgency="中" aria-pressed="false" aria-controls="requests">中</button><button type="button" data-urgency="低" aria-pressed="false" aria-controls="requests">低</button></div><p id="list-message" role="status" aria-live="polite"></p><div id="requests" aria-busy="false"></div></section>
<footer>報修登記系統 · 公開示範</footer></main></body></html>
